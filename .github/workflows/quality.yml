# Controles de calidad (T056; plan.md, "Diseño de la integración continua").
# Cada job es un control requerido con su nombre estable (FR-022) y ejecuta el
# mismo comando que en local (FR-016). Sin credenciales del proyecto: solo el
# token efímero de lectura que usan checkout y setup-node, que nunca se pasa a
# los comandos (FR-019 y FR-021).
name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# Un pull request cancela sus ejecuciones anteriores. Cualquier otro evento
# tiene un grupo propio por ejecución: una actualización de main nunca cancela
# ni sustituye a otra.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AULANORMA_LOG_LEVEL: info
      AULANORMA_ENVIRONMENT: ci
      AULANORMA_DATA_DIR: /tmp/aulanorma-ci-data
      AULANORMA_PUBLIC_ORIGIN: https://aulanorma.example
      AULANORMA_SESSION_IDLE_MINUTES: "30"
      AULANORMA_SESSION_MAX_HOURS: "12"
      AULANORMA_PDF_MAX_MIB: "32"
      AULANORMA_PDF_MAX_PAGES: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:format

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AULANORMA_LOG_LEVEL: info
      AULANORMA_ENVIRONMENT: ci
      AULANORMA_DATA_DIR: /tmp/aulanorma-ci-data
      AULANORMA_PUBLIC_ORIGIN: https://aulanorma.example
      AULANORMA_SESSION_IDLE_MINUTES: "30"
      AULANORMA_SESSION_MAX_HOURS: "12"
      AULANORMA_PDF_MAX_MIB: "32"
      AULANORMA_PDF_MAX_PAGES: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:lint

  types:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AULANORMA_LOG_LEVEL: info
      AULANORMA_ENVIRONMENT: ci
      AULANORMA_DATA_DIR: /tmp/aulanorma-ci-data
      AULANORMA_PUBLIC_ORIGIN: https://aulanorma.example
      AULANORMA_SESSION_IDLE_MINUTES: "30"
      AULANORMA_SESSION_MAX_HOURS: "12"
      AULANORMA_PDF_MAX_MIB: "32"
      AULANORMA_PDF_MAX_PAGES: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:types

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AULANORMA_LOG_LEVEL: info
      AULANORMA_ENVIRONMENT: ci
      AULANORMA_DATA_DIR: /tmp/aulanorma-ci-data
      AULANORMA_PUBLIC_ORIGIN: https://aulanorma.example
      AULANORMA_SESSION_IDLE_MINUTES: "30"
      AULANORMA_SESSION_MAX_HOURS: "12"
      AULANORMA_PDF_MAX_MIB: "32"
      AULANORMA_PDF_MAX_PAGES: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # qpdf, verificado por su huella: lo usan las pruebas de los PDF.
      - run: npm run tools:install
      - run: npm run check:test

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AULANORMA_LOG_LEVEL: info
      AULANORMA_ENVIRONMENT: ci
      AULANORMA_DATA_DIR: /tmp/aulanorma-ci-data
      AULANORMA_PUBLIC_ORIGIN: https://aulanorma.example
      AULANORMA_SESSION_IDLE_MINUTES: "30"
      AULANORMA_SESSION_MAX_HOURS: "12"
      AULANORMA_PDF_MAX_MIB: "32"
      AULANORMA_PDF_MAX_PAGES: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:build

  # Verificación de la plataforma macOS: ejecuta el agregado de las
  # categorías 1 a 5; no es una categoría.
  macos-quality:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AULANORMA_LOG_LEVEL: info
      AULANORMA_ENVIRONMENT: ci
      AULANORMA_DATA_DIR: /tmp/aulanorma-ci-data
      AULANORMA_PUBLIC_ORIGIN: https://aulanorma.example
      AULANORMA_SESSION_IDLE_MINUTES: "30"
      AULANORMA_SESSION_MAX_HOURS: "12"
      AULANORMA_PDF_MAX_MIB: "32"
      AULANORMA_PDF_MAX_PAGES: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # qpdf, verificado por su huella: lo usan las pruebas de los PDF.
      - run: npm run tools:install
      - run: npm run check:quality
